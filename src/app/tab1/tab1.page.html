<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi día 🌷</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Presentación de la pantalla -->
  <div class="welcome-section">
    <p class="date-label">MIS PEQUEÑOS LOGROS</p>
    <h1>Mi día 🌷</h1>
    <p class="welcome-message">
      Pequeños pasos, grandes cambios.
    </p>
  </div>

  <!-- Tarjeta de progreso -->
  <div class="progress-card">

    <div class="progress-heading">
      <h2>Tu progreso de hoy</h2>

      <!-- Mostramos la cantidad de hábitos completados y el total -->
      <span>{{ completedHabits }} de {{ habits.length }}</span>
    </div>

    <div class="progress-track">

      <!-- El ancho de la barra depende del porcentaje calculado en TypeScript -->
      <div class="progress-fill" [style.width.%]="progress">
      </div>

    </div>

    <p>¡Vas por buen camino!</p>
  </div>

  <!-- Lista de hábitos -->
  <div class="habits-section">
    <h2>Mis hábitos</h2>

    <!-- @for recorre el arreglo y genera una tarjeta por cada hábito -->
    @for (habit of habits; track habit.id) {

    <button type="button" class="habit-card" [class.completed]="habit.completed" (click)="toggleHabit(habit.id)">

      <!-- El ícono cambia según el estado del hábito -->
      <ion-icon [name]="habit.completed ? 'checkmark-circle' : 'ellipse-outline'"
        [color]="habit.completed ? 'success' : 'medium'">
      </ion-icon>

      <div>
        <h3>{{ habit.name }}</h3>
        <p>{{ habit.time }}</p>
      </div>

    </button>

    }

    <!-- Se muestra si todavía no hay hábitos -->
    @empty {
    <p class="empty-message">
      Todavía no tenés hábitos. ¡Agregá el primero!
    </p>
    }

  </div>

  <!-- Botón para abrir el formulario de nuevo hábito -->
  <button type="button" class="add-habit" (click)="openAddHabitModal()">

    <ion-icon name="add-circle-outline"></ion-icon>
    <span>Agregar hábito</span>

  </button>

</ion-content>
